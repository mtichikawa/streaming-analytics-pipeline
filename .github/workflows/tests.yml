name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # CI runs the pure-Python suite. The Spark-gated tests (OHLCV
      # aggregation/watermark, end-to-end checkpoint recovery) auto-skip here
      # with no JDK, the same as any environment without Spark — keeping CI
      # fast and green. Run them locally with a JDK + PySpark installed.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v
